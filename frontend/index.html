<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-72x72.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <meta name="description" content="SchedAI — the AI schedule manager that plans your day. Tasks, calendar, email and focus time in one calm workspace." />
    <meta name="keywords" content="productivity, task management, AI assistant, schedule, calendar, email, planner, focus timer" />
    <meta name="author" content="SchedAI" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SchedAI — The AI schedule manager" />
    <meta property="og:description" content="Tasks, calendar, email and focus time in one calm, AI-assisted workspace." />
    <meta property="og:image" content="/icons/icon-512x512.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="SchedAI — The AI schedule manager" />
    <meta property="twitter:description" content="Tasks, calendar, email and focus time in one calm, AI-assisted workspace." />
    <meta property="twitter:image" content="/icons/icon-512x512.png" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SchedAI" />

    <!-- Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <!-- ==================================================================
         Boot splash
         Rendered before any JS so the first paint is instant and branded.
         It reads the saved theme from localStorage and matches it, so there
         is no bright-white flash for dark-mode users. main.jsx removes it.
         ================================================================== -->
    <style>
      :root {
        --boot-bg: #f8fafc;
        --boot-bg-2: #eef2ff;
        --boot-ink: #0f172a;
        --boot-muted: #64748b;
        --boot-line: rgba(15, 23, 42, 0.08);
        --boot-accent: #6366f1;
        --boot-accent-2: #8b5cf6;
      }

      /* Dark theme variants (data-theme set by the inline script below) */
      html[data-boot='dark'],
      html[data-boot='midnight'],
      html[data-boot='nord'] {
        --boot-bg: #0b1120;
        --boot-bg-2: #111c33;
        --boot-ink: #f1f5f9;
        --boot-muted: #94a3b8;
        --boot-line: rgba(255, 255, 255, 0.09);
      }
      html[data-boot='nord'] {
        --boot-bg: #2e3440;
        --boot-bg-2: #3b4252;
      }
      html[data-boot='sand'] {
        --boot-bg: #fdfbf7;
        --boot-bg-2: #f6efe3;
        --boot-ink: #2a2118;
        --boot-muted: #7c6f5f;
        --boot-line: rgba(42, 33, 24, 0.1);
      }

      html,
      body {
        margin: 0;
        background: var(--boot-bg);
      }

      #root {
        min-height: 100vh;
      }

      .boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(60rem 40rem at 50% -10%, var(--boot-bg-2), transparent 70%),
          var(--boot-bg);
        color: var(--boot-ink);
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      .boot--leaving {
        opacity: 0;
        visibility: hidden;
      }

      .boot__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.35rem;
        padding: 2rem;
        width: min(22rem, 84vw);
        text-align: center;
        animation: boot-rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      /* Mark — glass tile with a stroke-draw calendar glyph */
      .boot__mark {
        position: relative;
        isolation: isolate;
        display: grid;
        place-items: center;
        width: 5.25rem;
        height: 5.25rem;
        border-radius: 1.6rem;
        background: linear-gradient(140deg, var(--boot-accent), var(--boot-accent-2));
        box-shadow:
          0 18px 40px -12px rgba(99, 102, 241, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.18) inset;
        animation: boot-pop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .boot__mark::before {
        /* soft breathing halo — painted behind the tile via a lower z-index
           inside the isolated stacking context created above */
        content: '';
        position: absolute;
        inset: -0.9rem;
        border-radius: 2.6rem;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.34), transparent 62%);
        animation: boot-breathe 2.6s ease-in-out infinite;
        z-index: -1;
      }
      .boot__mark svg {
        position: relative;
        z-index: 1;
      }
      .boot__mark svg {
        width: 2.85rem;
        height: 2.85rem;
        color: #fff;
      }
      .boot__mark svg * {
        stroke-dasharray: 40;
        stroke-dashoffset: 40;
        animation: boot-draw 1.1s ease-out 0.15s forwards;
      }
      .boot__mark svg *:nth-child(2) { animation-delay: 0.3s; }
      .boot__mark svg *:nth-child(3) { animation-delay: 0.42s; }
      .boot__mark svg *:nth-child(4) { animation-delay: 0.54s; }

      .boot__word {
        font-family: Poppins, Inter, sans-serif;
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1;
      }
      .boot__word span {
        background: linear-gradient(100deg, var(--boot-accent), var(--boot-accent-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .boot__tagline {
        margin-top: -0.55rem;
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--boot-muted);
      }

      /* Indeterminate progress bar, plus a real status line */
      .boot__track {
        position: relative;
        width: 100%;
        height: 3px;
        border-radius: 999px;
        background: var(--boot-line);
        overflow: hidden;
      }
      .boot__bar {
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--boot-accent), var(--boot-accent-2));
        animation: boot-slide 1.35s ease-in-out infinite;
      }
      .boot__status {
        margin-top: -0.5rem;
        font-size: 0.7rem;
        font-weight: 500;
        color: var(--boot-muted);
        min-height: 1rem;
      }

      .boot__skeleton {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        width: 100%;
        margin-top: 0.35rem;
      }
      .boot__skeleton i {
        display: block;
        height: 0.5rem;
        border-radius: 999px;
        background: var(--boot-line);
        animation: boot-pulse 1.5s ease-in-out infinite;
      }
      .boot__skeleton i:nth-child(2) { width: 78%; animation-delay: 0.15s; }
      .boot__skeleton i:nth-child(3) { width: 56%; animation-delay: 0.3s; }

      /* Standalone overlay: survives splash dismissal and covers any view. */
      .boot__recovery {
        position: fixed;
        left: 50%;
        bottom: 1.5rem;
        transform: translateX(-50%);
        z-index: 2147483000;
        width: min(24rem, calc(100vw - 2rem));
        padding: 0.95rem;
        border-radius: 0.9rem;
        border: 1px solid var(--boot-line, rgba(15, 23, 42, 0.14));
        background: var(--boot-bg, #ffffff);
        color: var(--boot-ink, #0f172a);
        box-shadow: 0 18px 40px -12px rgba(15, 23, 42, 0.28);
        text-align: center;
      }
      .boot__recovery[hidden] { display: none; }
      .boot__recovery-text {
        margin: 0 0 0.7rem;
        font-size: 0.78rem;
        font-weight: 500;
        line-height: 1.45;
        color: inherit;
      }
      .boot__recovery-actions {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .boot__btn {
        appearance: none;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 0.74rem;
        font-weight: 600;
        padding: 0.45rem 0.85rem;
        border-radius: 0.6rem;
        cursor: pointer;
        transition: opacity 0.2s ease;
      }
      .boot__btn:hover { opacity: 0.75; }
      .boot__btn--primary {
        border-color: transparent;
        background: linear-gradient(100deg, #6366f1, #8b5cf6);
        color: #fff;
      }
      .boot__recovery-hint {
        margin: 0.6rem 0 0;
        font-size: 0.65rem;
        line-height: 1.4;
        opacity: 0.7;
      }

      @keyframes boot-rise {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes boot-pop {
        0% { opacity: 0; transform: scale(0.72) rotate(-8deg); }
        100% { opacity: 1; transform: none; }
      }
      @keyframes boot-breathe {
        0%, 100% { opacity: 0.55; transform: scale(0.94); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      @keyframes boot-draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes boot-slide {
        0% { left: -40%; }
        100% { left: 100%; }
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.8; }
      }

      /* Respect reduced motion */
      @media (prefers-reduced-motion: reduce) {
        .boot__inner,
        .boot__mark,
        .boot__mark::before,
        .boot__mark svg *,
        .boot__bar,
        .boot__skeleton i {
          animation: none !important;
        }
        .boot__mark svg * { stroke-dashoffset: 0; }
        .boot__bar { left: 30%; }
      }
    </style>

    <!-- Apply the saved theme to the splash before first paint (no flash) -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme-mode') || localStorage.getItem('theme');
          if (theme === 'dark' || theme === 'midnight' || theme === 'nord' || theme === 'sand' || theme === 'light') {
            document.documentElement.setAttribute('data-boot', theme);
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-boot', 'dark');
          }
          var accent = localStorage.getItem('theme-accent');
          if (accent) document.documentElement.setAttribute('data-boot-accent', accent);
        } catch (e) {
          /* storage blocked — keep the default light splash */
        }
      })();
    </script>

    <title>SchedAI — The AI schedule manager</title>
  </head>
  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: sans-serif;">
        <h1>JavaScript Required</h1>
        <p>You need to enable JavaScript to run this application.</p>
      </div>
    </noscript>

    <!-- Boot splash -->
    <div id="boot-splash" class="boot" role="status" aria-live="polite" aria-label="Loading SchedAI">
      <div class="boot__inner">
        <div class="boot__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4.5" width="18" height="16" rx="4" />
            <path d="M3 9h18" />
            <path d="M8 2.8v3.4M16 2.8v3.4" />
            <path d="M7.6 13.4l2.1 2.1 4.7-4.6" />
          </svg>
        </div>

        <div>
          <p class="boot__word">Sched<span>AI</span></p>
          <p class="boot__tagline">The AI schedule manager</p>
        </div>

        <div class="boot__track" aria-hidden="true"><span class="boot__bar"></span></div>
        <p class="boot__status" id="boot-status">Waking up your workspace…</p>

        <div class="boot__skeleton" aria-hidden="true">
          <i></i><i></i><i></i>
        </div>

      </div>
    </div>

    <!--
      Recovery overlay. Lives OUTSIDE #boot-splash so it still works after the
      splash is gone — a lazy route chunk can fail at any point, not just during
      the first paint. Hidden until something actually goes wrong.
    -->
    <div class="boot__recovery" id="boot-recovery" role="alert" hidden>
      <p class="boot__recovery-text" id="boot-recovery-text">
        This is taking longer than usual.
      </p>
      <div class="boot__recovery-actions">
        <button type="button" class="boot__btn boot__btn--primary" id="boot-reload">
          Reload
        </button>
        <button type="button" class="boot__btn" id="boot-reset">
          Clear cache &amp; reload
        </button>
      </div>
      <p class="boot__recovery-hint">
        Clearing the cache fixes a stale offline copy after an update.
      </p>
    </div>

    <!-- App Root -->
    <div id="root"></div>

    <!-- Main Script -->
    <script type="module" src="/src/main.jsx"></script>

    <!--
      Boot watchdog.
      Runs as plain inline script so it works even when the bundle fails to
      load at all (stale service-worker cache, blocked chunk, syntax error in a
      lazy route, offline). Without this the splash spins forever and the user
      has no way out.
    -->
    <script>
      (function () {
        window.__bootStart = Date.now();
        window.__bootDone = false;

        var statusEl = document.getElementById('boot-status');
        var recovery = document.getElementById('boot-recovery');
        var recoveryText = document.getElementById('boot-recovery-text');

        function showRecovery(message) {
          // Deliberately NOT gated on __bootDone: a lazy route chunk can fail
          // long after boot, and the user still needs a way out.
          if (statusEl && !window.__bootDone) statusEl.textContent = 'Something went wrong';
          if (recoveryText && message) recoveryText.textContent = message;
          if (recovery) recovery.hidden = false;
        }

        // Let the app reuse the overlay for post-boot chunk failures.
        window.__bootShowRecovery = showRecovery;

        // The bundle imports main.jsx and then calls dismissBootSplash().
        // If that hasn't happened by now, the app is not going to boot.
        var slowTimer = setTimeout(function () {
          if (window.__bootDone) return;
          if (statusEl) statusEl.textContent = 'Still loading — this is taking a while…';
        }, 8000);

        var failTimer = setTimeout(function () {
          showRecovery(
            'The app did not finish loading. This is usually a stale offline copy after an update.'
          );
        }, 20000);

        window.__bootRecovered = function () {
          clearTimeout(slowTimer);
          clearTimeout(failTimer);
          window.__bootDone = true;
        };

        // A missing chunk is the classic stale-cache symptom: report it at once
        // rather than waiting for the full timeout.
        window.addEventListener('error', function (event) {
          var target = event.target;
          if (target && target.tagName === 'SCRIPT') {
            showRecovery('A required file failed to load. Clear the cache and reload.');
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var message = String((event.reason && event.reason.message) || event.reason || '');
          if (/Failed to fetch dynamically imported module|Importing a module script failed|ChunkLoadError/i.test(message)) {
            showRecovery('A required file failed to load. Clear the cache and reload.');
          }
        });

        document.getElementById('boot-reload').addEventListener('click', function () {
          window.location.reload();
        });

        document.getElementById('boot-reset').addEventListener('click', function () {
          // Unregister service workers and drop caches so the next load pulls a
          // fresh shell + chunks. Then hard-reload.
          var done = function () {
            if (window.caches && caches.keys) {
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).then(function () { window.location.reload(); }, function () { window.location.reload(); });
            } else {
              window.location.reload();
            }
          };
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              Promise.all(regs.map(function (r) { return r.unregister(); })).then(done, done);
            }, done);
          } else {
            done();
          }
        });
      })();
    </script>
  </body>
</html>
