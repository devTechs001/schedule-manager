name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.21.0

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: pnpm install --frozen-lockfile

    - name: Build frontend
      working-directory: ./frontend
      run: pnpm build
      env:
        VITE_BASE_PATH: /${{ github.event.repository.name }}/
        VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}
        VITE_ENABLE_AI_FEATURES: ${{ vars.VITE_ENABLE_AI_FEATURES || 'false' }}
        VITE_ENABLE_NOTIFICATIONS: ${{ vars.VITE_ENABLE_NOTIFICATIONS || 'false' }}
        VITE_ENABLE_COLLABORATION: ${{ vars.VITE_ENABLE_COLLABORATION || 'false' }}
        VITE_ENABLE_REALTIME: ${{ vars.VITE_ENABLE_REALTIME || 'false' }}
        VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
        VITE_ANALYTICS_ID: ${{ secrets.VITE_ANALYTICS_ID }}
        VITE_MAX_TASKS_PER_DAY: ${{ vars.VITE_MAX_TASKS_PER_DAY || '50' }}
        VITE_MAX_TEAM_MEMBERS: ${{ vars.VITE_MAX_TEAM_MEMBERS || '10' }}
        VITE_IMAGE_UPLOAD_LIMIT: ${{ vars.VITE_IMAGE_UPLOAD_LIMIT || '5242880' }}
        VITE_DEBUG_MODE: ${{ vars.VITE_DEBUG_MODE || 'false' }}
        VITE_MOCK_DATA: ${{ vars.VITE_MOCK_DATA || 'false' }}
        VITE_ASSET_BASE_URL: ${{ vars.VITE_ASSET_BASE_URL || '' }}
        VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL || 'http://localhost:5000' }}
        VITE_SOCKET_TIMEOUT: ${{ vars.VITE_SOCKET_TIMEOUT || '30000' }}

    # GitHub Pages has to be switched on for the repository once, by an admin,
    # before any of the steps below can work. Previously this job failed on
    # every push with "Get Pages site failed"; now it reports that clearly and
    # skips the deploy instead of turning the build red. Once Pages is enabled
    # (Settings → Pages → Source: GitHub Actions) the next push deploys
    # automatically with no further changes.
    - name: Check whether GitHub Pages is enabled
      id: pages_check
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        status=$(curl -s -o /dev/null -w '%{http_code}' \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/pages")
        echo "Pages API responded $status"
        if [ "$status" = "200" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Pages site found — proceeding with deploy."
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          {
            echo "### GitHub Pages is not enabled"
            echo ""
            echo "The frontend built successfully, but there is no Pages site for this repository,"
            echo "so the deploy was skipped. (Pages API returned \`$status\`.)"
            echo ""
            echo "To publish the app: **Settings → Pages → Source: GitHub Actions**, then re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Pages deploy skipped::GitHub Pages is not enabled for this repository. Enable it under Settings → Pages (Source: GitHub Actions) to publish the frontend."
        fi

    - name: Setup Pages
      if: steps.pages_check.outputs.enabled == 'true'
      uses: actions/configure-pages@v4

    - name: Upload artifact
      if: steps.pages_check.outputs.enabled == 'true'
      uses: actions/upload-pages-artifact@v3
      with:
        path: './frontend/dist'

    - name: Deploy to GitHub Pages
      if: steps.pages_check.outputs.enabled == 'true'
      id: deployment
      uses: actions/deploy-pages@v4
